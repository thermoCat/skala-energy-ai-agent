<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>에너지 허브 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: dark; --bg: #1e1e2e; --panel: #191926; --line: #34344a; --muted: #9a9ac0; --text: #e6e6f2; --accent: #6b6bea; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 14px; }
  #app { height: 100%; display: flex; flex-direction: column; }
  header { padding: 10px 18px; background: #262638; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  header b { font-size: 15px; margin-right: auto; white-space: nowrap; }
  header button { white-space: nowrap; }
  header label { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  button { padding: 8px 14px; border-radius: 9px; border: none; background: var(--accent); color: white; font-size: 13px; cursor: pointer; }
  button.ghost { background: #34345a; }
  button.link { background: transparent; color: var(--muted); padding: 0; font-size: 12px; }
  button:disabled { background: #3a3a52; cursor: default; }
  main { flex: 1; min-height: 0; display: flex; }
  #map { flex: 1; min-width: 0; }
  aside { width: 440px; display: flex; flex-direction: column; border-left: 1px solid var(--line); }

  /* 정보 패널 — 판정 한 줄 + 숫자 3개, 나머지는 접기 */
  .panel { flex: 0 0 auto; max-height: 42%; overflow-y: auto; padding: 14px 16px; background: var(--panel); border-bottom: 2px solid var(--line); }
  .panel h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sub { color: var(--muted); font-size: 12px; margin: 3px 0 10px; }
  .badge { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 10px; background: #3a3a52; }
  .badge.fast { background: #6b4e00; color: #ffd36b; }
  .badge.red { background: #5a1d22; color: #ff9a9e; }
  .badge.blue { background: #10345a; color: #8cc8ff; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: #23233a; border-radius: 9px; padding: 8px 10px; }
  .tile .v { font-size: 18px; font-weight: 600; }
  .tile .k { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .why { font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 10px; background: #2b2b44; cursor: pointer; }
  details { margin-top: 10px; font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; }
  details table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  details td, details th { padding: 3px 4px; border-bottom: 1px solid #2b2b40; text-align: left; font-weight: 400; }
  .decide { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .decide select, .decide input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .decide input { flex: 1; min-width: 110px; }
  .decide button { padding: 4px 10px; font-size: 12px; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.6; }

  /* 알림 — 제목 한 줄 + 먼저 볼 거점 */
  .alert { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .alert.unread { border-color: #ffb86b; }
  .alert .t { font-weight: 600; }
  .alert .s { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .alert .chip { font-size: 12px; }
  .jobs { display: flex; gap: 6px; margin-top: 4px; }
  .jobs button { padding: 5px 10px; font-size: 12px; }

  /* 채팅 */
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 94%; padding: 10px 13px; border-radius: 12px; line-height: 1.6; }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2a2a40; border-bottom-left-radius: 4px; }
  .bubble .line { margin: 2px 0; }
  .bubble .head { font-weight: 600; margin-bottom: 4px; }
  .bubble .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .bubble .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button.small { padding: 5px 11px; font-size: 12px; }
  .bubble .decide { margin-top: 8px; }
  .detail { margin-top: 8px; font-size: 13px; }
  .detail .kv { display: grid; grid-template-columns: 84px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .detail .kv .k { color: var(--muted); font-size: 12px; }
  .detail .kv-sub { padding: 0 0 6px 92px; color: #ffd36b; font-size: 12px; }
  .detail .fix { margin-top: 6px; padding: 5px 9px; border-radius: 7px; background: #3a2e14; color: #ffd08a; font-size: 12px; }
  .detail .line { padding: 4px 0; border-top: 1px solid var(--line); }
  .bubble .raw { white-space: pre-wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .progress { font-size: 12px; color: var(--muted); }
  .progress .warn { color: #ffb86b; }
  .progress ul { margin: 4px 0 0; padding-left: 16px; }
  .progress li.link { cursor: pointer; text-decoration: underline dotted; }
  .composer { padding: 10px 16px; background: #262638; border-top: 1px solid var(--line); }
  .target { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .suggest button { padding: 5px 10px; font-size: 12px; background: #34345a; }
  form.ask { display: flex; gap: 8px; }
  form.ask input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 13px; }

  /* 지도 표식 */
  /* 좁은 화면: 지도를 위, 패널·채팅을 아래로 */
  @media (max-width: 900px) {
    main { flex-direction: column; }
    #map { flex: 0 0 42vh; }
    aside { width: 100%; flex: 1; min-height: 0; border-left: none; border-top: 1px solid var(--line); }
    .panel { max-height: 38%; }
    header { gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  }

  .pin-diamond { transform: rotate(45deg); border: 1px solid #111; }
  .pin-bolt { font-size: 15px; line-height: 15px; text-shadow: 0 0 3px #000; }
  .legend { background: rgba(30,30,46,.92); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.7; }
  .legend summary { cursor: pointer; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid #111; }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>{{ company }} 에너지 허브</b>
    <label><input type="checkbox" v-model="ownOnly" /> 자사만</label>
    <label><input type="checkbox" v-model="showDistricts" /> 자치구 신호</label>
    <button type="button" class="ghost" @click="showAlerts">🔔 알림 {{ unread }}</button>
  </header>
  <main>
    <div id="map"></div>
    <aside>
      <div class="panel">
        <!-- 주유소 -->
        <template v-if="panel.kind === 'station' && panel.card">
          <h3>{{ panel.card.name }}
            <span v-if="panel.card.verdict" class="badge" :class="{ fast: panel.card.verdict.code === 'fast_candidate' }">{{ panel.card.verdict.label }}</span>
            <span v-else class="badge">타사 · 공개 정보만</span>
          </h3>
          <div class="sub">{{ panel.card.gu }} · {{ panel.card.brand }} · {{ panel.card.facility }}</div>
          <div class="tiles">
            <div class="tile"><div class="v">{{ panel.card.fast_1km }}</div><div class="k">반경 1km 급속<span v-if="panel.card.cluster_median_fast_1km !== undefined"> (묶음 중앙값 {{ panel.card.cluster_median_fast_1km }})</span></div></div>
            <div class="tile"><div class="v">{{ panel.card.fast_1km_busy_pct ?? '-' }}<small v-if="panel.card.fast_1km_busy_pct !== null">%</small></div><div class="k">주변 충전 중 비율</div></div>
            <div class="tile"><div class="v">{{ panel.card.in_station_fast_ids }}</div><div class="k">주유소 안 급속</div></div>
          </div>
          <div v-if="panel.card.verdict" class="why">{{ stationWhy(panel.card) }}</div>
          <div v-if="panel.decisions.length" class="sub" style="margin-top:8px">지난 결정: {{ panel.decisions[0].choice }}{{ panel.decisions[0].note ? ' — ' + panel.decisions[0].note : '' }} ({{ panel.decisions[0].created_at.slice(5, 10) }})</div>
        </template>

        <!-- 자치구 -->
        <template v-else-if="panel.kind === 'gu' && panel.district">
          <h3>{{ panel.district.gu }}
            <span v-if="districtFlags.ev" class="badge red">전기 병목</span>
            <span v-for="f in districtFlags.idle" :key="f" class="badge blue">{{ f }} 감소</span>
          </h3>
          <div class="sub">{{ company }} 거점 {{ panel.district.own_stations.length }}곳</div>
          <div class="tiles">
            <div class="tile"><div class="v">{{ signed(ev.rate_pct) }}%</div><div class="k">전기차 1년 (서울 {{ signed(ev.seoul_rate_pct) }}%)</div></div>
            <div class="tile"><div class="v">{{ Math.round(panel.district.supply.fast_per_10k_ev) }}</div><div class="k">1만 대당 급속 (서울 {{ Math.round(panel.district.supply.seoul_fast_per_10k_ev) }})</div></div>
            <div class="tile"><div class="v">{{ signed(panel.district.demand.fuels['경유'].rate_pct) }}%</div><div class="k">경유차 1년</div></div>
          </div>
          <div v-if="candidates.length" class="chips">
            <span class="hint">⚡ 급속 후보</span>
            <span v-for="s in candidates" :key="s.station_id" class="chip" @click="focusStation(s.station_id)">{{ s.name }}</span>
          </div>
          <div v-else class="why">급속 후보 없음 — 전기 병목 자치구가 아님</div>
          <details>
            <summary>거점 전체 · 연료별 수치</summary>
            <table>
              <tr v-for="s in panel.cluster.stations" :key="s.station_id" @click="focusStation(s.station_id)" style="cursor:pointer">
                <td>{{ s.name }}</td><td>{{ s.facility }}</td><td>반경 급속 {{ s.fast_1km }}</td><td>{{ s.label }}</td>
              </tr>
            </table>
            <table>
              <tr v-for="(v, fuel) in panel.district.demand.fuels" :key="fuel">
                <td>{{ fuel }}</td><td>{{ signed(v.rate_pct) }}%</td><td>서울 {{ signed(v.seoul_rate_pct) }}%</td>
              </tr>
            </table>
          </details>
        </template>

        <!-- 알림함 -->
        <template v-else-if="panel.kind === 'alerts'">
          <h3>알림</h3>
          <div class="jobs">
            <button type="button" class="ghost" :disabled="watching" @click="runJob('daily_watch')">매일 감시 실행</button>
            <button type="button" class="ghost" :disabled="watching" @click="runJob('weekly')">주간 경쟁 실행</button>
          </div>
          <div v-if="panel.runInfo" class="sub" style="margin-top:6px">{{ panel.runInfo }}</div>
          <div v-if="!panel.alerts.length" class="hint" style="margin-top:8px">알림이 없습니다. 변화가 없으면 알림을 만들지 않습니다.</div>
          <div v-for="a in panel.alerts" :key="a.id" class="alert" :class="{ unread: !a.read }">
            <div class="t">{{ alertTitle(a) }}</div>
            <div class="s">{{ alertWindow(a) }}</div>
            <div class="chips" style="margin-top:0">
              <span v-for="x in alertTop(a)" :key="x.id" class="chip" @click="openAlertStation(a, x.id)">{{ x.text }}</span>
            </div>
          </div>
        </template>

        <div v-else class="hint">지도에서 주유소 핀이나 자치구를 누르세요.<br/>숫자는 바로 뜨고, 질문이 채워집니다.</div>
      </div>

      <!-- 채팅 -->
      <div id="log" ref="logEl">
        <template v-for="item in log" :key="item.id">
          <div v-if="item.kind === 'user'" class="row user"><div class="bubble">{{ item.text }}</div></div>
          <div v-else-if="item.kind === 'steps'" class="progress">
            <span :class="{ warn: item.warn }">{{ item.done ? '✓ ' + item.summary : '⏳ ' + (item.steps.at(-1)?.text || '시작') }}</span>
            <button v-if="item.steps.length" type="button" class="link" @click="item.open = !item.open"> {{ item.open ? '접기' : '단계 보기' }}</button>
            <ul v-if="item.open">
              <li v-for="(s, i) in item.steps" :key="i" :class="{ warn: s.warn, link: s.stationId }"
                  @click="s.stationId && focusStation(s.stationId)">{{ s.text }}</li>
            </ul>
          </div>
          <div v-else-if="item.kind === 'agent'" class="row agent">
            <div class="bubble">
              <template v-for="(l, i) in answerView(item.text).top" :key="'t' + i">
                <div :class="l.cls">{{ l.text }}</div>
              </template>
              <div v-if="answerView(item.text).foot" class="note">{{ answerView(item.text).foot }}</div>
              <div v-if="item.done && item.more" class="detail">
                <template v-for="(l, i) in answerView(item.text).more" :key="'m' + i">
                  <div v-if="l.cls === 'kv'" class="kv"><span class="k">{{ l.k }}</span><span>{{ l.text }}</span></div>
                  <div v-else :class="l.cls">{{ l.text }}</div>
                </template>
                <button type="button" class="link" @click="item.raw = !item.raw">{{ item.raw ? '근거 번호 숨기기' : '근거 번호 보기' }}</button>
                <div v-if="item.raw" class="raw">{{ item.text }}</div>
              </div>
              <div v-if="item.done" class="actions">
                <button v-if="answerView(item.text).more.length" type="button" class="ghost small" @click="item.more = !item.more">{{ item.more ? '접기' : '자세히 보기' }}</button>
                <button v-if="item.stationId && !item.deciding && !item.saved" type="button" class="small" @click="item.deciding = true">📝 이 주유소 결정 남기기</button>
              </div>
              <form v-if="item.done && item.deciding" class="decide" @submit.prevent="saveDecision(item)">
                <select v-model="decision.choice"><option>진행</option><option>보류</option><option>제외</option></select>
                <input type="text" v-model="decision.note" placeholder="메모 (예: 부지 협의 필요)" />
                <button type="submit">저장</button>
                <button type="button" class="ghost" @click="item.deciding = false">취소</button>
              </form>
              <div v-if="item.saved" class="note">✓ 결정을 남겼습니다. 다음에 물으면 AI가 이 결정을 함께 봅니다.</div>
            </div>
          </div>
        </template>
      </div>
      <div class="composer">
        <div v-if="target" class="target">대상: {{ target.label }} <button type="button" class="link" @click="clearTarget">✕ 해제</button></div>
        <div v-if="suggestions.length" class="suggest">
          <button v-for="q in suggestions" :key="q" type="button" @click="input = targetPrefix() + q">{{ q }}</button>
        </div>
        <form class="ask" @submit.prevent="onSubmit">
          <input type="text" v-model="input" autocomplete="off" placeholder="예: 박미주유소에 급속 2기 넣으면?" />
          <button type="submit" :disabled="sending">보내기</button>
        </form>
      </div>
    </aside>
  </main>
</div>

<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const { createApp, ref, reactive, computed, nextTick, onMounted, watch } = Vue;

// 회사 공식 색 대신 색각 이상을 고려한 구분용 8색 (Okabe-Ito)
const BRAND_COLORS = {
  'SK에너지': '#D55E00', 'HD현대오일뱅크': '#0072B2', 'GS칼텍스': '#009E73', 'S-OIL': '#F0E442',
  'SK가스': '#CC79A7', 'E1': '#56B4E9', '알뜰': '#E69F00', '자가상표': '#000000',
};
const brandColor = b => BRAND_COLORS[b.startsWith('알뜰') ? '알뜰' : b] || '#888888';
const yn = v => v === true ? '예' : v === false ? '아니오' : '판별 없음';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 화면에서는 근거 번호를 숨기고 "근거 번호 보기"로 펼친다 — 번호는 검증용이라 읽기에 방해가 됨
const stripCites = t => t.replace(/\[[FJ]\d+\]/g, '').replace(/[ \t]+/g, ' ').trim();
const ITEM_NAMES = { ev_bottleneck: '전기 병목', diesel_idle: '경유차 감소', lpg_idle: 'LPG차 감소',
  fast_candidates: '급속 후보', ev_bottleneck_before: '추가 전 병목', ev_bottleneck_after: '추가 후 병목' };

createApp({
  setup() {
    const company = 'SK에너지';
    const ownOnly = ref(false);
    const showDistricts = ref(true);
    const panel = reactive({ kind: null, card: null, district: null, cluster: null, decisions: [],
                             alerts: [], runInfo: '' });
    const unread = ref(0);
    const watching = ref(false);
    const decision = reactive({ choice: '보류', note: '' });
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const target = ref(null);        // {station_id | gu, label, prefix}
    const suggestions = ref([]);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0, map = null, pinsData = null;
    const pinsById = {};
    const pinLayer = L.layerGroup(), districtLayer = L.layerGroup();

    const signed = v => (v > 0 ? '+' : '') + v.toFixed(1);
    const targetPrefix = () => target.value ? target.value.prefix : '';
    const getJson = url => fetch(url).then(r => r.json());
    const q = encodeURIComponent;

    // ── 지도 ───────────────────────────────────────────────────
    function drawPins(pins) {
      pinLayer.clearLayers();
      for (const p of pins) {
        if (ownOnly.value && !p.own) continue;
        const color = brandColor(p.brand);
        let marker;
        // 자사·타사를 같은 크기로 그린다 — 자사만 크게 그리면 지도가 자사 거점만 있는 것처럼 보인다
        if (p.prodcd === 'K015') {
          marker = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', iconSize: [9, 9],
            html: `<div class="pin-diamond" style="width:9px;height:9px;background:${color}"></div>` }) });
        } else {
          marker = L.circleMarker([p.lat, p.lng], { radius: 5, color: '#222', weight: 1,
            fillColor: color, fillOpacity: 0.85 });
        }
        marker.bindTooltip(`${esc(p.name)} · ${esc(p.brand)}`);
        marker.on('click', () => selectStation(p));
        pinLayer.addLayer(marker);
        if (p.badge) {
          pinLayer.addLayer(L.marker([p.lat, p.lng], { interactive: false, icon: L.divIcon({
            className: 'pin-bolt', html: '⚡', iconSize: [15, 15], iconAnchor: [7, 22] }) }));
        }
      }
    }

    // 자치구 경계(통계청 2013, 25개 구)를 따라 신호를 칠한다 — 확대·축소해도 경계에 붙어 있음
    function districtStyle(d) {
      const idle = d.diesel_idle || d.lpg_idle;
      return { color: idle ? '#3b8eea' : '#8a8aa8', weight: idle ? 3 : 1, dashArray: idle ? '6 4' : null,
               fillColor: d.ev_bottleneck ? '#e5484d' : '#000', fillOpacity: d.ev_bottleneck ? 0.28 : 0.02 };
    }
    function drawDistricts(boundaries, districts) {
      districtLayer.clearLayers();
      L.geoJSON(boundaries, {
        style: f => districtStyle(districts[f.properties.name] || {}),
        onEachFeature: (f, layer) => {
          const gu = f.properties.name, d = districts[gu] || {};
          const tags = [d.ev_bottleneck && '전기 병목', d.diesel_idle && '경유차 감소',
                        d.lpg_idle && 'LPG차 감소'].filter(Boolean).join(' · ');
          layer.bindTooltip(`${esc(gu)}${tags ? ' — ' + esc(tags) : ''}`, { sticky: true });
          layer.on('click', () => selectDistrict(gu));
          layer.on('mouseover', () => layer.setStyle({ weight: 3, color: '#ffffff' }));
          layer.on('mouseout', () => layer.setStyle(districtStyle(d)));
        },
      }).addTo(districtLayer);
    }

    function addLegend() {
      const legend = L.control({ position: 'bottomleft' });
      legend.onAdd = () => {
        const div = L.DomUtil.create('div', 'legend');
        // 좁은 화면에선 범례가 지도를 가려서 접힌 채로 시작한다
        const open = window.innerWidth > 900 ? ' open' : '';
        div.innerHTML = `<details${open}><summary>범례</summary>`
          + Object.entries(BRAND_COLORS).map(([b, c]) => `<div><i style="background:${c}"></i>${esc(b)}</div>`).join('')
          + '<div style="margin-top:4px">● 주유소 ◆ LPG · ⚡ 급속 후보</div>'
          + '<div>구: 빨강 전기 병목 · 파란 점선 경유·LPG차 감소</div></details>';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      legend.addTo(map);
    }

    onMounted(async () => {
      map = L.map('map', { preferCanvas: true }).setView([37.5565, 126.99], 11);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
      districtLayer.addTo(map);
      pinLayer.addTo(map);
      addLegend();
      const [pins, boundaries] = await Promise.all([
        getJson(`/api/pins?company=${q(company)}`), getJson('/api/boundaries')]);
      pinsData = pins;
      for (const p of pinsData.pins) pinsById[p.station_id] = p;
      drawDistricts(boundaries, pinsData.districts);
      drawPins(pinsData.pins);
      refreshUnread();
    });
    watch(ownOnly, () => pinsData && drawPins(pinsData.pins));
    // 핀과 같은 캔버스에 그려야 구 클릭이 먹힌다 — 다시 켤 때는 핀 아래로 내린다
    watch(showDistricts, v => v
      ? districtLayer.addTo(map).eachLayer(g => g.bringToBack())
      : districtLayer.remove());

    // ── 정보 패널 ───────────────────────────────────────────────
    function stationWhy(card) {
      if (card.verdict.code === 'fast_candidate') return '⚡ ' + card.verdict.reasons.join(' · ');
      const reasons = card.verdict.reasons.length ? card.verdict.reasons.join(' · ') : '급속 후보 조건에 해당하지 않음';
      const idle = (card.fuel_signals || []).filter(f => f.idle).map(f => `${f.fuel}차 감소 큰 구`).join(' · ');
      return idle ? `${reasons} · 🔻 ${idle}` : reasons;
    }
    const ev = computed(() => panel.district?.demand.fuels['전기'] || {});
    const districtFlags = computed(() => {
      const d = pinsData?.districts[panel.district?.gu] || {};
      return { ev: d.ev_bottleneck, idle: [d.diesel_idle && '경유차', d.lpg_idle && 'LPG차'].filter(Boolean) };
    });
    const candidates = computed(() => (panel.cluster?.stations || []).filter(s => s.verdict === 'fast_candidate'));

    async function selectStation(p) {
      const card = await getJson(`/api/stations/${p.station_id}/card?company=${q(company)}`);
      Object.assign(panel, { kind: 'station', card, district: null, cluster: null, decisions: [] });
      if (card.is_own) loadDecisions(p.station_id);
      const prefix = `[${p.name}] `;
      target.value = { station_id: p.station_id, label: `${p.name} · ${p.gu}`, prefix };
      suggestions.value = card.is_own ? ['이 주유소에 무엇을 더해야 해?', '급속 2기 넣으면?']
                                      : ['이 주유소 주변 경쟁 현황은?'];
      input.value = prefix + suggestions.value[0];
    }

    async function selectDistrict(gu) {
      const [district, cluster] = await Promise.all([
        getJson(`/api/districts/${q(gu)}?company=${q(company)}`),
        getJson(`/api/clusters/${q(gu)}?company=${q(company)}`)]);
      Object.assign(panel, { kind: 'gu', card: null, district, cluster });
      target.value = { gu, label: `${gu} ${company} 거점`, prefix: '' };
      suggestions.value = [`${gu} ${company} 거점을 어떻게 나눠 써야 해?`];
      input.value = suggestions.value[0];
    }

    function focusStation(stationId) {
      const p = pinsById[stationId];
      if (!p) return;
      map.setView([p.lat, p.lng], 15);
      selectStation(p);
    }

    function clearTarget() { target.value = null; suggestions.value = []; }

    async function loadDecisions(stationId) {
      const data = await getJson(`/api/decisions?company=${q(company)}&station_id=${stationId}`);
      panel.decisions = data.human || [];
    }

    // 사람이 진단을 보고 남기는 결정 — AI는 읽기만 하고 다음 판단(지난 결정·우선순위)에 반영
    async function saveDecision(item) {
      const body = { station_id: item.stationId, company, choice: decision.choice, note: decision.note };
      const r = await fetch('/api/decisions', { method: 'POST', headers: { 'content-type': 'application/json' },
                                                body: JSON.stringify(body) });
      if (!r.ok) { alert('저장 실패: ' + JSON.stringify((await r.json()).detail)); return; }
      decision.note = '';
      item.deciding = false; item.saved = true;
      if (panel.card?.station_id === item.stationId) loadDecisions(item.stationId);
    }

    // ── 알림 ───────────────────────────────────────────────────
    async function refreshUnread() {
      unread.value = (await getJson(`/api/alerts?company=${q(company)}&unread=true`)).alerts.length;
    }
    async function showAlerts() {
      Object.assign(panel, { kind: 'alerts', alerts: (await getJson(`/api/alerts?company=${q(company)}`)).alerts });
    }
    async function runJob(job) {
      const title = job === 'weekly' ? '주간 경쟁' : '매일 감시';
      watching.value = true;
      try {
        const res = await (await fetch(`/api/jobs/${job}/run?company=${q(company)}`, { method: 'POST' })).json();
        panel.runInfo = res.alert_id ? `${title}: 알림 1건 (LLM ${res.llm_calls}회)`
                                     : `${title}: 변화 없음 → 알림 없음 (LLM ${res.llm_calls}회)`;
        await refreshUnread();
        await showAlerts();
      } finally {
        watching.value = false;
      }
    }
    function alertTitle(a) {
      const p = a.payload;
      if (a.job === 'weekly') return `주간 경쟁 · 자사 거점 1km 안 변화 ${p.changes.length}건 (타사 신설 ${p.competitor_new}건)`;
      return `매일 감시 · 새로 멈춘 급속 ${p.new_failures}개 · 거점 ${p.stations.length}곳`;
    }
    const alertWindow = a => a.payload.window.map(w => w.slice(5, 16).replace('T', ' ')).join(' → ');
    function alertTop(a) {
      if (a.job === 'weekly') {
        return a.payload.changes.slice(0, 3).map(c => ({ id: c.station_id,
          text: `${c.name} · ${c.change} ${c.operator}${c.own_operator ? '' : '(타사)'} ${c.distance_m}m` }));
      }
      return a.payload.stations.slice(0, 3).map(s => ({ id: s.station_id, text: `${s.name} · 새 고장 ${s.new_failures}` }));
    }
    async function openAlertStation(alertItem, stationId) {
      if (!alertItem.read) {
        await fetch(`/api/alerts/${alertItem.id}/read?company=${q(company)}`, { method: 'POST' });
        alertItem.read = 1;
        refreshUnread();
      }
      focusStation(stationId);
    }

    // ── 채팅 (SSE) ──────────────────────────────────────────────
    // 답변을 "제목 + 요약 + 한 줄 안내"로 먼저 보여주고, 나머지는 "자세히 보기"로 접는다
    function answerView(text) {
      const lines = stripCites(text).split('\n').map(l => l.trim()).filter(Boolean);
      const top = [], more = [], foot = [];
      let corrected = 0;
      lines.forEach((l, i) => {
        if (i === 0 && l.startsWith('[')) top.push({ text: l.replace(/^\[|\]$/g, ''), cls: 'head' });
        else if (l.startsWith('요약:')) top.push({ text: l.replace(/^요약:\s*/, ''), cls: 'line' });
        else if (l.startsWith('※ 게이트 교정')) { corrected++; more.push({ text: l.replace(/^※\s*/, ''), cls: 'fix' }); }
        else if (l.startsWith('현장 확인')) { foot.push('현장 확인 필요'); more.push({ text: l, cls: 'note' }); }
        else if (l.startsWith('이 답변은')) foot.push('투자 결정이 아닌 진단');
        else if (l.startsWith('확정 판정 기준')) return;
        else {
          // "4) 이 주유소: …" 같은 줄은 항목 이름과 내용을 나눠 표처럼 보여준다
          const m = l.match(/^\d\)\s*([^:]{1,12}):\s*(.+)$/);
          if (m) more.push({ k: m[1], text: m[2], cls: 'kv' });
          else more.push({ text: l, cls: l.startsWith('※') ? 'note' : (more.at(-1)?.cls === 'kv' ? 'kv-sub' : 'line') });
        }
      });
      if (corrected) foot.unshift(`게이트 교정 ${corrected}건`);
      // 요약 줄이 없는 답(되묻기·공개 정보 등)은 전부 보여준다
      if (top.length < 2) return { top: top.concat(more), more: [], foot: foot.join(' · ') };
      return { top, more, foot: foot.join(' · ') };
    }

    function stepFor(e) {
      const name = id => pinsById[id]?.name || id;
      switch (e.type) {
        case 'StationResolved': return { text: `이름 찾기: "${e.query}" → ${e.count}곳`, key: 'resolve' };
        case 'AskUser': return { text: '같은 이름이 여러 곳 → 되묻기', warn: true, key: 'ask' };
        case 'PlanCreated': return { text: `${e.gu} 데이터 ${e.tools.length}종 조회`, key: 'plan' };
        case 'TaskCompleted': return e.ok === false ? { text: `${e.source} 실패 → 데이터 없음으로 표시`, warn: true, key: 'fail' } : null;
        case 'Replanned': return { text: `${e.from}에 자사 거점 없음 → ${e.to}로 재계획`, warn: true, key: 'replan' };
        case 'Judged': {
          const parts = Object.entries(e).filter(([k]) => ITEM_NAMES[k])
            .map(([k, v]) => `${ITEM_NAMES[k]} ${Array.isArray(v) ? v.length + '곳' : yn(v)}${(e.corrected_items || []).includes(k) ? '(교정됨)' : ''}`);
          return e.by === 'gate'
            ? { text: `권위 게이트 확정 · 교정 ${e.corrected}건: ${parts.join(', ')}`, key: 'gate', corrected: e.corrected }
            : { text: `AI 판별: ${parts.join(', ')}`, key: 'judge' };
        }
        case 'GateCorrected': {
          const fmt = v => Array.isArray(v) ? v.map(name).join(', ') || '없음' : yn(v);
          return { text: `게이트 교정: ${e.label} ${fmt(e.llm)} → ${fmt(e.baseline)}`, warn: true, key: 'fix' };
        }
        case 'EvidenceCard': return { text: `⚡ ${name(e.station_id)} — ${e.picked_by === 'gate' ? '게이트가 추가(교정됨)' : 'AI 선택'} · 눌러서 지도 이동`, stationId: e.station_id, key: 'card' };
        case 'Prioritized': return e.by === 'llm'
          ? { text: `어디부터 (AI 판단): ${e.order.map((id, i) => '①②③④'[i] + ' ' + name(id)).join(' ')}`, key: 'priority' }
          : { text: `AI 우선순위가 검사를 통과 못함 → 기본 순서`, warn: true, key: 'priority' };
        case 'Validation': return e.verdict === '합격' || e.verdict === '생략'
          ? { text: '검증 통과 (숫자·근거 대조)', key: 'valid' }
          : { text: `검증 ${e.verdict}: ${(e.issues || []).join(', ')}`, warn: true, key: 'valid' };
        default: return null;
      }
    }

    // 끝나면 단계 목록을 한 줄 요약으로 접는다
    function summarize(steps) {
      const has = k => steps.find(s => s.key === k);
      const parts = [];
      if (has('replan')) parts.push('재계획');
      if (has('judge')) parts.push('AI 판별');
      const gate = has('gate');
      if (gate) parts.push(gate.corrected ? `게이트 교정 ${gate.corrected}건` : '게이트 확인');
      if (has('priority')) parts.push(has('priority').warn ? '우선순위 기본 순서' : '우선순위 AI 판단');
      if (has('ask')) parts.push('되묻기');
      const valid = has('valid');
      if (valid) parts.push(valid.warn ? '검증 경고' : '검증 통과');
      return parts.length ? parts.join(' → ') : '답변 완료';
    }

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text || sending.value) return;
      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [], done: false, open: false, summary: '', warn: false });
      log.value.push(stepsItem);
      scrollToBottom();

      let ownStation = target.value?.station_id && panel.card?.station_id === target.value.station_id
        && panel.card.is_own ? target.value.station_id : null;
      const params = new URLSearchParams({ message: text, thread_id: thread, company });
      if (target.value?.station_id) params.set('station_id', target.value.station_id);
      if (target.value?.gu) params.set('gu', target.value.gu);
      const es = new EventSource(`/chat/stream?${params}`);
      let answer = null, attempt = null;
      const finish = () => {
        es.close(); sending.value = false;
        stepsItem.done = true;
        stepsItem.summary = summarize(stepsItem.steps);
        stepsItem.warn = stepsItem.steps.some(s => s.warn);
        if (answer) answer.done = true;
      };

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { finish(); return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }
        if (e.type === 'AnswerToken') {
          if (!answer || attempt !== e.attempt) {
            answer = reactive({ id: nextId++, kind: 'agent', text: '', raw: false, more: false, done: false, stationId: ownStation, deciding: false, saved: false });
            log.value.push(answer);
            attempt = e.attempt;
          }
          answer.text += e.delta;
          scrollToBottom();
          return;
        }
        if (e.type === 'FinalAnswer') {
          if (!answer) { answer = reactive({ id: nextId++, kind: 'agent', text: '', raw: false, more: false, done: false, stationId: ownStation, deciding: false, saved: false }); log.value.push(answer); }
          answer.text = e.reply;
          scrollToBottom();
          return;
        }
        // 이름으로 물어 한 곳으로 찾은 자사 주유소도 답변 아래 결정 버튼을 붙인다
        if (e.type === 'StationResolved' && pinsById[e.station_id]?.own) ownStation = e.station_id;
        const step = stepFor(e);
        if (step) { stepsItem.steps.push(step); scrollToBottom(); }
      };
      es.onerror = finish;
    }

    return { company, ownOnly, showDistricts, panel, decision, log, input, sending, logEl, target, suggestions,
             unread, watching, signed, targetPrefix, ev, districtFlags, candidates, stationWhy, focusStation,
             clearTarget, saveDecision, showAlerts, runJob, alertTitle, alertWindow, alertTop, openAlertStation,
             answerView, onSubmit };
  },
}).mount('#app');
</script>
</body>
</html>
