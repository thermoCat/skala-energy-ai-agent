<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>에너지 허브 대시보드</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    padding: 10px 18px; background: #262638; border-bottom: 1px solid #3a3a52;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px;
  }
  header > * { white-space: nowrap; }
  header b { font-size: 15px; }
  header .muted { color: #8b8bd8; font-size: 12px; }
  header label { font-size: 12px; color: #c3c3e0; display: flex; gap: 4px; align-items: center; }
  main { flex: 1; min-height: 0; display: flex; }
  #map { flex: 1; min-width: 0; }
  aside { width: 460px; display: flex; flex-direction: column; border-left: 1px solid #3a3a52; }

  /* 정보 패널 */
  .panel { flex: 0 0 45%; overflow-y: auto; padding: 12px 16px; border-bottom: 2px solid #3a3a52; font-size: 13px; background: #191926; }
  .panel h3 { margin: 0 0 6px; font-size: 15px; }
  .panel .sub { color: #9a9ac0; font-size: 12px; margin-bottom: 8px; }
  .panel table { width: 100%; border-collapse: collapse; margin: 6px 0; }
  .panel td, .panel th { padding: 3px 4px; border-bottom: 1px solid #2e2e42; text-align: left; vertical-align: top; }
  .panel th { color: #9a9ac0; font-weight: 400; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px; background: #3a3a52; font-size: 12px; }
  .badge.fast { background: #6b4e00; color: #ffd36b; }
  .badge.idle { background: #10345a; color: #8cc8ff; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { padding: 2px 8px; border-radius: 9px; border: 1px solid #3a3a52; font-size: 12px; color: #c3c3e0; }
  .note { color: #9a9ac0; font-size: 12px; margin-top: 6px; }
  .hbtn { padding: 5px 10px; font-size: 12px; background: #34345a; }
  .alert { border: 1px solid #3a3a52; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; white-space: pre-wrap; }
  .alert.unread { border-color: #ffb86b; }
  .alert .stations div { cursor: pointer; text-decoration: underline dotted; }
  .decide { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .decide select, .decide input { background: #1e1e2e; color: #e2e2f0; border: 1px solid #3a3a52; border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  .decide input { flex: 1; min-width: 120px; }
  .decide button { padding: 4px 10px; font-size: 12px; }

  /* 채팅 */
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 92%; padding: 9px 12px; border-radius: 12px; line-height: 1.5; font-size: 13px; white-space: pre-wrap; }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .steps { font-size: 12px; color: #9a9ac0; display: flex; flex-direction: column; gap: 2px; }
  .steps .step::before { content: "✓ "; color: #7ee787; }
  .steps .step.warn { color: #ffb86b; }
  .steps .step.warn::before { content: "⚠ "; color: #ffb86b; }
  .steps .step.link { cursor: pointer; text-decoration: underline dotted; }
  .prompt-box { background: #17171f; border: 1px solid #3a3a52; border-radius: 8px; font-size: 12px; }
  .prompt-box summary { cursor: pointer; padding: 6px 10px; color: #8b8bd8; }
  .prompt-box pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
  .composer { padding: 10px 16px; background: #262638; border-top: 1px solid #3a3a52; }
  .target { font-size: 12px; color: #c3c3e0; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
  .target button { padding: 0 6px; background: transparent; color: #9a9ac0; font-size: 12px; }
  .suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .suggest button { padding: 4px 10px; font-size: 12px; background: #34345a; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 13px;
  }
  button { padding: 10px 16px; border-radius: 10px; border: none; background: #5b5bd6; color: white; font-size: 13px; cursor: pointer; }
  button:disabled { background: #3a3a52; cursor: default; }

  /* 지도 표식 */
  .pin-diamond { transform: rotate(45deg); border: 1px solid #111; }
  .pin-bolt { font-size: 15px; line-height: 15px; text-shadow: 0 0 3px #000; }
  .legend { background: rgba(30,30,46,.92); color: #e2e2f0; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.7; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid #111; }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>{{ company }} 에너지 허브 대시보드</b>
    <span class="muted">{{ backendLabel }}</span>
    <button type="button" class="hbtn" @click="showAlerts">🔔 알림 {{ unread }}</button>
    <button type="button" class="hbtn" :disabled="watching" @click="runJob('daily_watch')">{{ watching ? '실행 중…' : '매일 감시 실행' }}</button>
    <button type="button" class="hbtn" :disabled="watching" @click="runJob('weekly')">주간 경쟁 실행</button>
    <label><input type="checkbox" v-model="ownOnly" /> 자사 핀만</label>
    <label><input type="checkbox" v-model="showDistricts" /> 자치구 신호 (빨강 전기 병목 · 파랑 테두리 유휴 위험)</label>
  </header>
  <main>
    <div id="map"></div>
    <aside>
      <!-- 정보 패널: LLM 없이 API 숫자만 즉시 -->
      <div class="panel">
        <template v-if="panel.kind === 'station' && panel.card">
          <h3>{{ panel.card.name }}</h3>
          <div class="sub">{{ panel.card.gu }} · {{ panel.card.brand }} · {{ panel.card.facility }} · {{ panel.card.station_id }} · 패널 {{ panel.ms }}ms</div>
          <div v-if="panel.card.verdict">
            <span class="badge" :class="{ fast: panel.card.verdict.code === 'fast_candidate' }">{{ panel.card.verdict.label }}</span>
            <span class="note"> 코드 기준 판정 (규칙 {{ panel.card.rule_version }})</span>
            <ul v-if="panel.card.verdict.reasons.length" class="note"><li v-for="r in panel.card.verdict.reasons" :key="r">{{ r }}</li></ul>
          </div>
          <div v-else class="note">타사 거점 — 공개 정보만 보여주고 투자 판별은 하지 않습니다.</div>
          <table>
            <tr><th>주유소 안 급속 ID</th><td>{{ panel.card.in_station_fast_ids }}개</td></tr>
            <tr><th>반경 1km 급속 ID</th><td>{{ panel.card.fast_1km }}<span v-if="panel.card.cluster_median_fast_1km !== undefined"> (묶음 중앙값 {{ panel.card.cluster_median_fast_1km }})</span></td></tr>
            <tr><th>반경 1km 충전 중 비율</th><td>{{ panel.card.fast_1km_busy_pct ?? '데이터 없음' }}<span v-if="panel.card.fast_1km_busy_pct !== null">% (한 시점, 대리 지표)</span></td></tr>
          </table>
          <div v-for="f in panel.card.fuel_signals || []" :key="f.fuel" class="note"><span class="badge idle">{{ f.label }}</span> {{ f.note }}</div>
          <template v-if="panel.card.verdict">
            <div class="note">결정 입력 (사람만 기록 — 에이전트는 읽기만)</div>
            <form class="decide" @submit.prevent="saveDecision">
              <select v-model="decision.choice"><option>진행</option><option>보류</option><option>제외</option></select>
              <select v-model="decision.conversion_type">
                <option :value="null">전환 유형 선택 안 함</option>
                <option v-for="t in panel.card.conversion_types" :key="t" :value="t">{{ t }}</option>
              </select>
              <input type="text" v-model="decision.note" placeholder="메모 (예: 부지 협의 필요)" />
              <button type="submit">저장</button>
            </form>
            <div v-for="d in panel.decisions" :key="d.id" class="note">· {{ d.created_at.slice(0, 16).replace('T', ' ') }} {{ d.choice }}<span v-if="d.conversion_type"> · {{ d.conversion_type }}</span> — {{ d.note }} ({{ d.decided_by }})</div>
          </template>
          <template v-if="panel.card.site_checks">
            <div class="note">전환 유형 선택지</div>
            <div class="chips"><span v-for="t in panel.card.conversion_types" :key="t" class="chip">{{ t }}</span></div>
            <div class="note">현장 확인 항목</div>
            <div class="chips"><span v-for="t in panel.card.site_checks" :key="t" class="chip">{{ t }}</span></div>
          </template>
        </template>

        <template v-else-if="panel.kind === 'gu' && panel.district">
          <h3>{{ panel.district.gu }} · {{ company }} 거점 {{ panel.district.own_stations.length }}곳</h3>
          <div class="sub">패널 {{ panel.ms }}ms · {{ panel.district.demand.months.join(' → ') }}</div>
          <table>
            <tr><th>연료</th><th>1년 증감</th><th>서울</th></tr>
            <tr v-for="(v, fuel) in panel.district.demand.fuels" :key="fuel">
              <td>{{ fuel }}</td><td>{{ signed(v.rate_pct) }}%</td><td>{{ signed(v.seoul_rate_pct) }}%</td>
            </tr>
          </table>
          <div class="note">전기차 1만 대당 급속 ID {{ panel.district.supply.fast_per_10k_ev }} (서울 {{ panel.district.supply.seoul_fast_per_10k_ev }}) · 수소충전소 {{ panel.district.h2.station_count }}곳 · 대기 {{ panel.district.h2.wait_total }}대</div>
          <template v-if="panel.cluster">
            <table>
              <tr><th>거점</th><th>반경 1km 급속</th><th>판정</th></tr>
              <tr v-for="s in panel.cluster.stations" :key="s.station_id" @click="focusStation(s.station_id)" style="cursor:pointer">
                <td>{{ s.name }}<div class="note">{{ s.facility }}</div></td>
                <td>{{ s.fast_1km }}</td>
                <td><span class="badge" :class="{ fast: s.verdict === 'fast_candidate' }">{{ s.label }}</span></td>
              </tr>
            </table>
            <div class="note">묶음 반경 1km 급속 중앙값 {{ panel.cluster.cluster_median_fast_1km }}</div>
            <div v-for="f in panel.cluster.fuel_signals.filter(x => x.idle)" :key="f.fuel" class="note"><span class="badge idle">{{ f.label }}</span> {{ f.note }}</div>
          </template>
        </template>

        <template v-else-if="panel.kind === 'alerts'">
          <h3>알림함</h3>
          <div class="sub">{{ panel.runInfo }}</div>
          <div v-if="!panel.alerts.length" class="note">알림이 없습니다. 이상이 없으면 알림을 만들지 않습니다 (LLM 0회).</div>
          <div v-for="a in panel.alerts" :key="a.id" class="alert" :class="{ unread: !a.read }">
            <div>{{ a.message }}</div>
            <div class="stations note">
              <div v-for="s in a.payload.stations || []" :key="s.station_id" @click="openAlertStation(a, s.station_id)">
                {{ s.name }} ({{ s.gu }}) — 새 고장 {{ s.new_failures }}개
              </div>
              <div v-for="c in a.payload.changes || []" :key="c.charger" @click="openAlertStation(a, c.station_id)">
                {{ c.name }} ({{ c.gu }}) — {{ c.change }} · {{ c.operator }}{{ c.own_operator ? ' (자사·계열)' : ' (타사)' }} · {{ c.distance_m }}m
              </div>
            </div>
          </div>
        </template>

        <div v-else class="note">지도에서 주유소 핀이나 자치구 원을 누르면 숫자가 바로 뜨고, 질문이 채워집니다.<br/>● 주유소 · ◆ LPG 충전소 · 큰 핀 = {{ company }} · ⚡ 급속 후보</div>
      </div>

      <!-- 채팅 -->
      <div id="log" ref="logEl">
        <template v-for="item in log" :key="item.id">
          <div v-if="item.kind === 'user'" class="row user"><div class="bubble">{{ item.text }}</div></div>
          <div v-else-if="item.kind === 'steps'" class="steps">
            <div v-for="(s, i) in item.steps" :key="i" class="step" :class="{ warn: s.warn, link: s.stationId }"
                 @click="s.stationId && focusStation(s.stationId)">{{ s.text }}</div>
          </div>
          <div v-else-if="item.kind === 'agent'" class="row agent"><div class="bubble">{{ item.text }}</div></div>
          <details v-else-if="item.kind === 'prompt'" class="prompt-box">
            <summary>LLM에 전달된 최종 프롬프트 보기</summary><pre>{{ item.text }}</pre>
          </details>
        </template>
      </div>
      <div class="composer">
        <div v-if="target" class="target">대상: {{ target.label }} <button type="button" @click="clearTarget">✕ 해제</button></div>
        <div v-if="suggestions.length" class="suggest">
          <button v-for="q in suggestions" :key="q" type="button" @click="input = targetPrefix() + q">{{ q }}</button>
        </div>
        <form @submit.prevent="onSubmit">
          <input type="text" v-model="input" autocomplete="off" placeholder="예: 박미주유소에 급속 2기 넣으면?" />
          <button type="submit" :disabled="sending">보내기</button>
        </form>
      </div>
    </aside>
  </main>
</div>

<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const { createApp, ref, reactive, nextTick, onMounted, watch } = Vue;

// 회사 공식 색 대신 색각 이상을 고려한 구분용 8색 (Okabe-Ito)
const BRAND_COLORS = {
  'SK에너지': '#D55E00', 'HD현대오일뱅크': '#0072B2', 'GS칼텍스': '#009E73', 'S-OIL': '#F0E442',
  'SK가스': '#CC79A7', 'E1': '#56B4E9', '알뜰': '#E69F00', '자가상표': '#000000',
};
const brandColor = b => BRAND_COLORS[b.startsWith('알뜰') ? '알뜰' : b] || '#888888';
const yn = v => v === true ? '예' : v === false ? '아니오' : '판별 없음';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const REQUEST_NAMES = { station: '주유소 진단', district: '자치구 묶음 진단', scenario: '급속 추가 시나리오' };
const TOOL_NAMES = {
  get_station_card: '주유소 카드', get_fuel_demand: '5개 연료 수요', get_ev_supply: '전기 공급',
  get_h2_status: '수소 대기', search_stations: '자사 거점 목록', score_district: '자치구 기준 판정',
  review_cluster: '묶음 기준 판정', simulate: '시나리오 계산',
  get_nearby_competition: '주변 경쟁 현황', get_decision_log: '판단 이력',
};
const ITEM_NAMES = { ev_bottleneck: '전기 병목', diesel_idle: '경유 유휴', lpg_idle: 'LPG 유휴',
  fast_candidates: '급속 후보', ev_bottleneck_before: '추가 전 병목', ev_bottleneck_after: '추가 후 병목' };

createApp({
  setup() {
    const company = 'SK에너지';
    const backendLabel = ref('');
    const ownOnly = ref(false);
    const showDistricts = ref(true);
    const panel = reactive({ kind: null, card: null, district: null, cluster: null, decisions: [],
                             alerts: [], runInfo: '', ms: 0 });
    const unread = ref(0);
    const watching = ref(false);
    const decision = reactive({ choice: '보류', conversion_type: null, note: '' });
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const target = ref(null);        // {station_id | gu, label, prefix}
    const suggestions = ref([]);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0, map = null;
    const pinsById = {};
    const pinLayer = L.layerGroup(), districtLayer = L.layerGroup();

    fetch('/health').then(r => r.json()).then(h => {
      backendLabel.value = `LLM ${h.llm_backend} (${h.fast_llm} / ${h.quality_llm})`;
    }).catch(() => {});

    const signed = v => (v > 0 ? '+' : '') + v.toFixed(1);
    const targetPrefix = () => target.value ? target.value.prefix : '';

    async function timedJson(url) {
      const t0 = performance.now();
      const r = await fetch(url);
      const data = await r.json();
      return [data, Math.round(performance.now() - t0)];
    }

    // ── 지도 ───────────────────────────────────────────────────
    function drawPins(pins) {
      pinLayer.clearLayers();
      for (const p of pins) {
        if (ownOnly.value && !p.own) continue;
        const color = brandColor(p.brand);
        let marker;
        if (p.prodcd === 'K015') {
          const size = p.own ? 12 : 8;
          marker = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', iconSize: [size, size],
            html: `<div class="pin-diamond" style="width:${size}px;height:${size}px;background:${color};opacity:${p.own ? 1 : 0.5}"></div>` }) });
        } else {
          marker = L.circleMarker([p.lat, p.lng], { radius: p.own ? 7 : 4, color: p.own ? '#111' : color,
            weight: p.own ? 2 : 1, fillColor: color, fillOpacity: p.own ? 0.95 : 0.45 });
        }
        marker.bindTooltip(`${esc(p.name)} · ${esc(p.brand)}`);
        marker.on('click', () => selectStation(p));
        pinLayer.addLayer(marker);
        if (p.badge) {
          pinLayer.addLayer(L.marker([p.lat, p.lng], { interactive: false, icon: L.divIcon({
            className: 'pin-bolt', html: '⚡', iconSize: [15, 15], iconAnchor: [7, 22] }) }));
        }
      }
    }

    function drawDistricts(pins, districts) {
      districtLayer.clearLayers();
      // 경계 도형이 없어 자치구 거점 좌표의 평균 위치에 원으로 표시
      const sums = {};
      for (const p of pins) {
        const s = sums[p.gu] ||= { lat: 0, lng: 0, n: 0 };
        s.lat += p.lat; s.lng += p.lng; s.n += 1;
      }
      for (const [gu, s] of Object.entries(sums)) {
        const d = districts[gu] || {};
        const idle = d.diesel_idle || d.lpg_idle;
        const circle = L.circleMarker([s.lat / s.n, s.lng / s.n], {
          radius: 22, weight: idle ? 3 : 1, color: idle ? '#3b8eea' : '#777',
          fillColor: d.ev_bottleneck ? '#e5484d' : '#888', fillOpacity: d.ev_bottleneck ? 0.35 : 0.08,
          dashArray: idle ? '4 3' : null });
        const tags = [d.ev_bottleneck && '전기 병목', d.diesel_idle && '경유 유휴 위험', d.lpg_idle && 'LPG 유휴 위험',
                      d.h2_stations && `수소충전소 ${d.h2_stations}곳`].filter(Boolean).join(' · ');
        circle.bindTooltip(`${esc(gu)}${tags ? ' — ' + esc(tags) : ''}`);
        circle.on('click', () => selectDistrict(gu));
        districtLayer.addLayer(circle);
      }
    }

    function addLegend() {
      const legend = L.control({ position: 'bottomleft' });
      legend.onAdd = () => {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = Object.entries(BRAND_COLORS)
          .map(([b, c]) => `<div><i style="background:${c}"></i>${esc(b)}</div>`).join('');
        return div;
      };
      legend.addTo(map);
    }

    let pinsData = null;
    onMounted(async () => {
      map = L.map('map', { preferCanvas: true }).setView([37.5565, 126.99], 11);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
      districtLayer.addTo(map);
      pinLayer.addTo(map);
      addLegend();
      const [data] = await timedJson(`/api/pins?company=${encodeURIComponent(company)}`);
      pinsData = data;
      for (const p of data.pins) pinsById[p.station_id] = p;
      drawDistricts(data.pins, data.districts);
      drawPins(data.pins);
      refreshUnread();
    });
    watch(ownOnly, () => pinsData && drawPins(pinsData.pins));
    watch(showDistricts, v => v ? districtLayer.addTo(map) : districtLayer.remove());

    // ── 핀·자치구 클릭 → 정보 패널 + 질문 채움 (자동 전송 안 함) ────────
    async function selectStation(p) {
      const [card, ms] = await timedJson(`/api/stations/${p.station_id}/card?company=${encodeURIComponent(company)}`);
      Object.assign(panel, { kind: 'station', card, district: null, cluster: null, decisions: [], ms });
      if (card.is_own) loadDecisions(p.station_id);
      const prefix = `[${p.gu} · ${p.brand} ${p.name}] `;
      target.value = { station_id: p.station_id, label: `${p.name} (${p.station_id})`, prefix };
      suggestions.value = card.is_own ? ['이 주유소에 무엇을 더해야 해?', '급속 2기 넣으면?']
                                      : ['이 주유소 주변 경쟁 현황은?'];
      input.value = prefix + suggestions.value[0];
    }

    async function selectDistrict(gu) {
      const [[district, ms], [cluster]] = await Promise.all([
        timedJson(`/api/districts/${encodeURIComponent(gu)}?company=${encodeURIComponent(company)}`),
        timedJson(`/api/clusters/${encodeURIComponent(gu)}?company=${encodeURIComponent(company)}`)]);
      Object.assign(panel, { kind: 'gu', card: null, district, cluster, ms });
      const n = district.own_stations.length;
      target.value = { gu, label: `${gu} (${company} 거점 ${n}곳)`, prefix: '' };
      suggestions.value = [`${gu} ${company} 거점 ${n}곳을 어떻게 나눠 써야 해?`];
      input.value = suggestions.value[0];
    }

    async function refreshUnread() {
      const [data] = await timedJson(`/api/alerts?company=${encodeURIComponent(company)}&unread=true`);
      unread.value = data.alerts.length;
    }

    async function showAlerts() {
      const [data] = await timedJson(`/api/alerts?company=${encodeURIComponent(company)}`);
      Object.assign(panel, { kind: 'alerts', alerts: data.alerts });
    }

    async function runJob(job) {
      const title = job === 'weekly' ? '주간 경쟁' : '매일 감시';
      watching.value = true;
      try {
        const r = await fetch(`/api/jobs/${job}/run?company=${encodeURIComponent(company)}`, { method: 'POST' });
        const res = await r.json();
        panel.runInfo = res.alert_id
          ? `${title} 실행: 알림 1건 (LLM ${res.llm_calls}회)`
          : `${title} 실행: 변화 없음 → 알림 없음 (LLM ${res.llm_calls}회)`;
        await refreshUnread();
        await showAlerts();
      } finally {
        watching.value = false;
      }
    }

    async function openAlertStation(alert, stationId) {
      if (!alert.read) {
        await fetch(`/api/alerts/${alert.id}/read?company=${encodeURIComponent(company)}`, { method: 'POST' });
        alert.read = 1;
        refreshUnread();
      }
      focusStation(stationId);
    }

    async function loadDecisions(stationId) {
      const [log] = await timedJson(`/api/decisions?company=${encodeURIComponent(company)}&station_id=${stationId}`);
      panel.decisions = log.human || [];
    }

    async function saveDecision() {
      const body = { station_id: panel.card.station_id, company, choice: decision.choice,
                     conversion_type: decision.conversion_type, note: decision.note };
      const r = await fetch('/api/decisions', { method: 'POST', headers: { 'content-type': 'application/json' },
                                                body: JSON.stringify(body) });
      if (!r.ok) { alert('저장 실패: ' + JSON.stringify((await r.json()).detail)); return; }
      decision.note = '';
      loadDecisions(panel.card.station_id);
    }

    function focusStation(stationId) {
      const p = pinsById[stationId];
      if (!p) return;
      map.setView([p.lat, p.lng], 15);
      selectStation(p);
    }

    function clearTarget() { target.value = null; suggestions.value = []; }

    // ── 채팅 (SSE) ──────────────────────────────────────────────
    function stepFor(e) {
      switch (e.type) {
        case 'RouteDecided': return e.request_type ? { text: `요청 분류: ${REQUEST_NAMES[e.request_type] || e.request_type}` } : null;
        case 'StationResolved': return { text: `이름 찾기: "${e.query}" → ${e.count}곳` };
        case 'AskUser': return { text: '같은 이름이 여러 곳 → 되묻기', warn: true };
        case 'PlanCreated': return { text: `조회 계획: ${e.gu} · Tool ${e.tools.length}개 병렬` };
        case 'TaskCompleted': {
          const name = TOOL_NAMES[e.source] || e.source;
          return e.ok === false ? { text: `${name} 실패 → 데이터 없음으로 표시`, warn: true } : { text: `${name} 조회` };
        }
        case 'FactsCollected': return { text: `사실 ${e.count}개 정리${e.is_own ? '' : ' (타사 — 판별하지 않음)'}` };
        case 'Replanned': return { text: `재계획: ${e.from}에 자사 거점 없음 → ${e.to}`, warn: true };
        case 'Judged': {
          const parts = Object.entries(e).filter(([k]) => ITEM_NAMES[k])
            .map(([k, v]) => `${ITEM_NAMES[k]} ${Array.isArray(v) ? v.length + '곳' : yn(v)}`);
          if (e.by === 'gate') {
            const fixed = new Set(e.corrected_items || []);
            const marked = Object.entries(e).filter(([k]) => ITEM_NAMES[k])
              .map(([k, v]) => `${ITEM_NAMES[k]} ${Array.isArray(v) ? v.length + '곳' : yn(v)}${fixed.has(k) ? '(교정됨)' : ''}`);
            return { text: `권위 게이트 확정 (교정 ${e.corrected}건): ` + marked.join(', ') };
          }
          return { text: '분석 에이전트 판별: ' + parts.join(', ') };
        }
        case 'GateCorrected': {
          const fmt = v => Array.isArray(v) ? v.map(id => pinsById[id]?.name || id).join(', ') || '없음' : yn(v);
          return { text: `게이트 교정: ${e.label} ${fmt(e.llm)} → ${fmt(e.baseline)}`, warn: true };
        }
        case 'EvidenceCard': return {
          text: `근거 카드 ⚡ ${pinsById[e.station_id]?.name || e.station_id} — ${e.picked_by === 'gate' ? '게이트가 기준으로 추가(교정됨)' : `AI 선택 (${e.facts.join(', ')})`} · 눌러서 지도 이동`,
          stationId: e.station_id, warn: e.picked_by === 'gate' };
        case 'Prioritized': return e.by === 'llm'
          ? { text: `어디부터 (AI 판단): ${e.order.map((id, i) => '①②③④'[i] + ' ' + (pinsById[id]?.name || id)).join(' ')}` }
          : { text: `AI 우선순위 판단 검사 불통과 → 기본 순서: ${(e.issues || []).join(', ')}`, warn: true };
        case 'DraftWritten': return { text: `답변 작성 (시도 ${e.attempt})` };
        case 'Validation': return e.verdict === '합격' || e.verdict === '생략'
          ? { text: '검증 통과 (숫자·근거 대조)' }
          : { text: `검증 ${e.verdict}: ${(e.issues || []).join(', ')}`, warn: true };
        case 'Finalize': return { text: '최종 답변 완성' };
        default: return null;
      }
    }

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text || sending.value) return;
      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      const params = new URLSearchParams({ message: text, thread_id: thread, company });
      if (target.value?.station_id) params.set('station_id', target.value.station_id);
      if (target.value?.gu) params.set('gu', target.value.gu);
      const es = new EventSource(`/chat/stream?${params}`);
      let streamItem = null, streamAttempt = null;

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }
        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }
        if (e.type === 'FinalAnswer') {
          if (!streamItem) { streamItem = reactive({ id: nextId++, kind: 'agent', text: '' }); log.value.push(streamItem); }
          streamItem.text = e.reply;
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null; streamAttempt = null;
          scrollToBottom();
          return;
        }
        const step = stepFor(e);
        if (step) { stepsItem.steps.push(step); scrollToBottom(); }
      };
      es.onerror = () => { es.close(); sending.value = false; };
    }

    return { company, backendLabel, ownOnly, showDistricts, panel, decision, log, input, sending, logEl,
             target, suggestions, signed, targetPrefix, focusStation, clearTarget, onSubmit, saveDecision,
             unread, watching, showAlerts, runJob, openAlertStation };
  },
}).mount('#app');
</script>
</body>
</html>
